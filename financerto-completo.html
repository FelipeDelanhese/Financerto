<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FinanCerto — Controle Financeiro Pessoal</title>
<meta name="description" content="FinanCerto: controle financeiro pessoal completo — receitas, despesas, contas, cartões, metas e orçamento.">
<meta name="theme-color" content="#0a0f0d">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinanCerto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   FINANCERTO — design tokens
   Paleta própria: verde/esmeralda (dinheiro, positivo) +
   azul-petróleo (estrutura), com semânticas claras de
   sucesso/alerta/perigo para status financeiros.
   ========================================================= */
:root{
  --font-display:'Plus Jakarta Sans', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  --nav-w:250px; --topbar-h:64px; --bottomnav-h:64px;
}
[data-theme="dark"]{
  --bg:#0a0f0d; --bg-alt:#0f1613; --surface:#141d19; --surface-2:#1b2620;
  --border:rgba(255,255,255,0.08); --text:#eef4f1; --text-dim:#8fa39a;
  --primary:#22c55e; --primary-2:#14b8a6; --info:#3b82f6;
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444;
  --shadow:0 18px 40px rgba(0,0,0,0.45);
}
[data-theme="light"]{
  --bg:#f5f8f6; --bg-alt:#ffffff; --surface:#ffffff; --surface-2:#eef3f0;
  --border:rgba(10,20,15,0.08); --text:#0e1512; --text-dim:#54655d;
  --primary:#16a34a; --primary-2:#0d9488; --info:#2563eb;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626;
  --shadow:0 18px 40px rgba(15,25,20,0.1);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--font-body); background:var(--bg); color:var(--text); overflow-x:hidden; }
h1,h2,h3,h4{ font-family:var(--font-display); }
button{ font-family:inherit; cursor:pointer; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
.mono{ font-family:var(--font-mono); }

#splash{
  position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8rem;
  transition:opacity .35s ease;
}
#splash .mark{ width:56px;height:56px;border-radius:16px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); display:flex; align-items:center; justify-content:center; color:#04150c; font-weight:800; font-family:var(--font-display); font-size:1.3rem; }
#splash.hide{ opacity:0; pointer-events:none; }

/* ---------- layout ---------- */
#shell{ display:flex; min-height:100vh; }

#sidebar{
  width:var(--nav-w); background:var(--bg-alt); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:1.3rem 1rem; flex-shrink:0;
  position:sticky; top:0; height:100vh; z-index:30; transition:transform .3s ease;
}
.brand{ display:flex; align-items:center; gap:.6rem; padding:.3rem .4rem 1.5rem; }
.brand .mark{ width:36px;height:36px;border-radius:10px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); display:flex; align-items:center; justify-content:center; color:#04150c; font-weight:800; font-family:var(--font-display); }
.brand span{ font-family:var(--font-display); font-weight:800; font-size:1.1rem; }

.nav-item{
  display:flex; align-items:center; gap:.7rem; padding:.62rem .75rem; border-radius:var(--radius-sm);
  color:var(--text-dim); background:none; border:none; width:100%; text-align:left; font-size:.88rem; font-weight:600;
  transition:background .15s ease, color .15s ease; margin-bottom:.15rem;
}
.nav-item .ic{ font-size:1.05rem; width:22px; text-align:center; }
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:color-mix(in srgb, var(--primary) 16%, transparent); color:var(--primary); }
.nav-sep{ height:1px; background:var(--border); margin:.7rem .3rem; }

#sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:25; }
#sidebar-overlay.show{ display:block; }

#main{ flex:1; min-width:0; display:flex; flex-direction:column; padding-bottom:0; }
#topbar{
  display:flex; align-items:center; justify-content:space-between; height:var(--topbar-h);
  padding:0 1.4rem; border-bottom:1px solid var(--border); background:var(--bg-alt);
  position:sticky; top:0; z-index:20;
}
#hamburger{ display:none; }
#page-title{ font-size:1.1rem; font-weight:800; }
.topbar-right{ display:flex; align-items:center; gap:.6rem; }
.icon-btn{ width:38px;height:38px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:1rem; position:relative; }
.bell-count{
  position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:.6rem; font-weight:800;
  width:16px;height:16px;border-radius:50%; display:flex; align-items:center; justify-content:center;
}

#content{ padding:1.4rem; max-width:1200px; width:100%; margin:0 auto; padding-bottom:2rem; }
.page{ display:none; animation:fadeIn .3s ease; }
.page.active{ display:block; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

/* ---------- componentes genéricos ---------- */
.grid{ display:grid; gap:1rem; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:1.4fr 1fr; }
@media (max-width:980px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }
@media (max-width:560px){ .grid-4{grid-template-columns:1fr 1fr;} }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.25rem; box-shadow:var(--shadow); }
.card h3{ font-size:.98rem; margin-bottom:.9rem; }
.section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:.6rem; }
.section-head h2{ font-size:1.25rem; }

.btn{ display:inline-flex; align-items:center; gap:.4rem; border:none; border-radius:var(--radius-sm); padding:.6rem 1.1rem; font-weight:700; font-size:.85rem; transition:transform .12s ease, opacity .12s ease; }
.btn:active{ transform:scale(.96); }
.btn-primary{ background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#04150c; }
.btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-danger{ background:color-mix(in srgb, var(--danger) 15%, transparent); color:var(--danger); }
.btn-sm{ padding:.4rem .8rem; font-size:.78rem; }
.btn-block{ width:100%; justify-content:center; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }

input, select, textarea{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.55rem .75rem; color:var(--text); font-family:inherit; font-size:.88rem; width:100%; }
textarea{ resize:vertical; min-height:70px; }
label{ font-size:.78rem; color:var(--text-dim); margin-bottom:.3rem; display:block; }
.field{ margin-bottom:.8rem; }
.field .err{ color:var(--danger); font-size:.74rem; margin-top:.3rem; display:none; }
.field.invalid input, .field.invalid select{ border-color:var(--danger); }
.field.invalid .err{ display:block; }
.form-row{ display:flex; gap:.7rem; flex-wrap:wrap; }
.form-row > *{ flex:1; min-width:140px; }

.progress-bar{ height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; border-radius:99px; transition:width .6s ease; }

.badge{ font-size:.68rem; font-weight:700; padding:.2rem .55rem; border-radius:999px; white-space:nowrap; }
.badge-success{ background:color-mix(in srgb, var(--success) 18%, transparent); color:var(--success); }
.badge-warning{ background:color-mix(in srgb, var(--warning) 18%, transparent); color:var(--warning); }
.badge-danger{ background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger); }
.badge-info{ background:color-mix(in srgb, var(--info) 18%, transparent); color:var(--info); }
.badge-demo{ background:color-mix(in srgb, var(--text-dim) 20%, transparent); color:var(--text-dim); }

.empty-hint{ color:var(--text-dim); font-size:.85rem; text-align:center; padding:1.6rem 0; }

.stat-card{ display:flex; flex-direction:column; gap:.3rem; }
.stat-card .top{ display:flex; justify-content:space-between; align-items:center; color:var(--text-dim); font-size:.78rem; }
.stat-card .val{ font-family:var(--font-mono); font-size:1.5rem; font-weight:700; overflow-wrap:anywhere; }
.stat-card .val.pos{ color:var(--success); } .stat-card .val.neg{ color:var(--danger); }

/* ---------- listas de transação / itens ---------- */
.row-item{ display:flex; align-items:center; gap:.8rem; padding:.75rem .3rem; border-bottom:1px solid var(--border); }
.row-item:last-child{ border-bottom:none; }
.row-icon{ width:38px;height:38px;border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.05rem; flex-shrink:0; }
.row-main{ flex:1; min-width:0; }
.row-title{ font-size:.9rem; font-weight:600; }
.row-meta{ font-size:.74rem; color:var(--text-dim); margin-top:.15rem; }
.row-amount{ font-family:var(--font-mono); font-weight:700; font-size:.92rem; white-space:nowrap; }
.row-amount.income{ color:var(--success); } .row-amount.expense{ color:var(--danger); }
.row-actions{ display:flex; gap:.3rem; }
.row-actions button{ background:none; border:none; color:var(--text-dim); font-size:.95rem; padding:.2rem .3rem; }
.row-actions button:hover{ color:var(--text); }

/* ---------- filtros ---------- */
.filters-bar{ display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem; }
.filters-bar select, .filters-bar input{ width:auto; min-width:130px; }
.chip-filter{ display:flex; gap:.4rem; flex-wrap:wrap; }
.chip-filter button{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); padding:.4rem .8rem; border-radius:999px; font-size:.78rem; font-weight:600; }
.chip-filter button.active{ background:color-mix(in srgb, var(--primary) 20%, transparent); color:var(--primary); border-color:var(--primary); }

/* ---------- alertas / notificações ---------- */
.alert-row{ display:flex; gap:.7rem; align-items:flex-start; padding:.7rem 0; border-bottom:1px solid var(--border); }
.alert-row:last-child{ border-bottom:none; }
.alert-dot{ width:9px;height:9px;border-radius:50%; margin-top:.4rem; flex-shrink:0; }
.alert-row p{ font-size:.85rem; }
.alert-row .sub{ font-size:.72rem; color:var(--text-dim); }
#notif-panel{
  position:absolute; top:calc(var(--topbar-h) + 6px); right:1rem; width:320px; max-width:90vw;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow);
  padding:1rem; z-index:60; display:none; max-height:70vh; overflow-y:auto;
}
#notif-panel.open{ display:block; }

/* ---------- cartões de crédito ---------- */
.cc-card{ border-radius:18px; padding:1.4rem; color:#fff; position:relative; overflow:hidden; min-height:150px; display:flex; flex-direction:column; justify-content:space-between; }
.cc-card .cc-name{ font-weight:700; font-family:var(--font-display); }
.cc-card .cc-limit{ font-family:var(--font-mono); font-size:1.3rem; font-weight:800; }
.cc-card .cc-sub{ font-size:.72rem; opacity:.85; }
.cc-bar{ height:6px; background:rgba(255,255,255,.25); border-radius:99px; overflow:hidden; margin-top:.5rem; }
.cc-bar-fill{ height:100%; background:#fff; }

/* ---------- gráficos ---------- */
.chart-legend{ display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.7rem; font-size:.76rem; }
.chart-legend span{ display:flex; align-items:center; gap:.35rem; color:var(--text-dim); }
.chart-legend i{ width:9px;height:9px;border-radius:2px; display:inline-block; }

/* ---------- modal ---------- */
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.open{ display:flex; }
@media (min-width:700px){ .modal-overlay{ align-items:center; } }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:20px 20px 0 0; padding:1.5rem; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); }
@media (min-width:700px){ .modal{ border-radius:20px; } }
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.1rem; }
.type-toggle{ display:flex; background:var(--surface-2); border-radius:999px; padding:.25rem; margin-bottom:1rem; }
.type-toggle button{ flex:1; border:none; background:none; padding:.5rem; border-radius:999px; font-weight:700; font-size:.85rem; color:var(--text-dim); }
.type-toggle button.active{ background:var(--surface); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.15); }

/* ---------- toast ---------- */
#toast-wrap{ position:fixed; bottom:calc(var(--bottomnav-h) + 1rem); right:1rem; left:1rem; z-index:150; display:flex; flex-direction:column; align-items:flex-end; gap:.6rem; pointer-events:none; }
@media (min-width:700px){ #toast-wrap{ left:auto; bottom:1.2rem; } }
.toast{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.8rem 1.1rem; font-size:.85rem; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:.6rem; animation:toastIn .25s ease; max-width:320px; }
@keyframes toastIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ---------- FAB + bottom nav (mobile) ---------- */
#bottom-nav{ display:none; }
#fab-add{ display:none; }

@media (max-width:860px){
  #sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); }
  #sidebar.open{ transform:translateX(0); }
  #hamburger{ display:flex; align-items:center; justify-content:center; }
  #content{ padding:1rem; padding-bottom:calc(var(--bottomnav-h) + 1.2rem); }

  #bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; height:var(--bottomnav-h); z-index:35;
    background:var(--bg-alt); border-top:1px solid var(--border); align-items:center; justify-content:space-around;
  }
  #bottom-nav button{ background:none; border:none; color:var(--text-dim); font-size:1.15rem; display:flex; flex-direction:column; align-items:center; gap:.15rem; }
  #bottom-nav button span.lbl{ font-size:.6rem; font-weight:700; }
  #bottom-nav button.active{ color:var(--primary); }

  #fab-add{
    display:flex; position:fixed; bottom:calc(var(--bottomnav-h) + 14px); right:18px; z-index:36;
    width:54px;height:54px;border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#04150c; font-size:1.6rem; align-items:center; justify-content:center; box-shadow:0 10px 26px color-mix(in srgb, var(--primary) 45%, transparent);
    border:none;
  }
}

@media (max-width:400px){
  .stat-card .val{ font-size:1.2rem; }
  .grid-4{ grid-template-columns:1fr 1fr; }
  .cc-limit{ font-size:1.1rem !important; }
}

</style>
</head>
<body>

<div id="splash"><div class="mark">F$</div><div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800;">FinanCerto</div></div>

<div id="sidebar-overlay"></div>

<div id="shell">
  <aside id="sidebar">
    <div class="brand"><span class="mark">F$</span><span>FinanCerto</span></div>

    <button class="nav-item" data-page="dashboard"><span class="ic">◈</span>Dashboard</button>
    <button class="nav-item" data-page="transacoes"><span class="ic">☰</span>Transações</button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-page="receitas"><span class="ic">⬆</span>Receitas</button>
    <button class="nav-item" data-page="despesas"><span class="ic">⬇</span>Despesas</button>
    <button class="nav-item" data-page="contas"><span class="ic">🏦</span>Contas</button>
    <button class="nav-item" data-page="cartoes"><span class="ic">💳</span>Cartões</button>
    <button class="nav-item" data-page="contasPagar"><span class="ic">🧾</span>Contas a Pagar</button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-page="metas"><span class="ic">🎯</span>Metas</button>
    <button class="nav-item" data-page="orcamento"><span class="ic">📊</span>Orçamento</button>
    <button class="nav-item" data-page="relatorios"><span class="ic">📈</span>Relatórios</button>
    <div class="nav-sep"></div>
    <button class="nav-item" id="clear-demo-btn"><span class="ic">🧹</span>Zerar todos os dados</button>
  </aside>

  <div id="main">
    <div id="topbar">
      <div style="display:flex; align-items:center; gap:.8rem;">
        <button class="icon-btn" id="hamburger">☰</button>
        <div id="page-title">Dashboard</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" id="quick-add-btn">+ Novo</button>
        <button class="icon-btn" id="bell-btn">🔔<span class="bell-count" id="bell-count">0</span></button>
        <button class="icon-btn" id="theme-toggle">🌙</button>
      </div>
    </div>

    <div id="notif-panel"></div>

    <div id="content">
      <div class="page" id="page-dashboard"></div>
      <div class="page" id="page-transacoes"></div>
      <div class="page" id="page-receitas"></div>
      <div class="page" id="page-despesas"></div>
      <div class="page" id="page-contas"></div>
      <div class="page" id="page-cartoes"></div>
      <div class="page" id="page-contasPagar"></div>
      <div class="page" id="page-metas"></div>
      <div class="page" id="page-orcamento"></div>
      <div class="page" id="page-relatorios"></div>
    </div>
  </div>
</div>

<div id="bottom-nav">
  <button data-page="dashboard">◈<span class="lbl">Início</span></button>
  <button data-page="transacoes">☰<span class="lbl">Lançtos</span></button>
  <button data-page="contas">🏦<span class="lbl">Contas</span></button>
  <button data-page="metas">🎯<span class="lbl">Metas</span></button>
</div>
<button id="fab-add">+</button>

<div class="modal-overlay" id="quick-modal-overlay">
  <div class="modal">
    <div class="modal-head"><h3>Novo lançamento</h3><button class="icon-btn" id="quick-modal-close">✕</button></div>
    <div class="type-toggle">
      <button data-type="despesa" class="active">Despesa</button>
      <button data-type="receita">Receita</button>
    </div>
    <div id="quick-form-body"></div>
  </div>
</div>

<div class="modal-overlay" id="account-picker-overlay">
  <div class="modal" style="max-width:360px;">
    <div class="modal-head"><h3 id="account-picker-title">Escolha a conta</h3><button class="icon-btn" id="account-picker-close">✕</button></div>
    <div id="account-picker-list"></div>
  </div>
</div>

<div id="toast-wrap"></div>

<script>
/* =========================================================
   FINANCERTO — app.js
   Organização:
   1) utilidades de data/moeda      6) modal de lançamento rápido
   2) estado + persistência          7) páginas: dashboard
   3) cálculos derivados (saldo,     8) páginas: transações/receitas/despesas
      fatura, orçamento, alertas)    9) páginas: contas/cartões/contas a pagar
   4) navegação                     10) páginas: metas/orçamento/relatórios
   5) gráficos SVG                  11) inicialização
   ========================================================= */

/* ---------------------------------------------------------
   1) DATA E MOEDA
   --------------------------------------------------------- */
function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(base,n){ const d=new Date(base); d.setDate(d.getDate()+n); return d; }
function addMonths(base,n){ const d=new Date(base); d.setMonth(d.getMonth()+n); return d; }
function todayISO(){ return isoDate(new Date()); }
function firstDayOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function lastDayOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function fmtDateBR(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR'); }
function fmtMonthLabel(d){ return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''); }
const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
function fmtMoney(n){ return BRL.format(n || 0); }
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000); }

// escapa texto do usuário antes de inserir via innerHTML — evita que uma descrição/nome
// com caracteres como < > quebre o layout ou injete HTML/script indevido.
function escapeHTML(str){
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHTML(str); }

/* ---------------------------------------------------------
   2) ESTADO E PERSISTÊNCIA
   --------------------------------------------------------- */
const SAVE_KEY = 'financerto_state_v1';

function buildDefaultState(){
  return {
    accounts:[],
    categories:{
      receita:[
        { id:'salario', name:'Salário', icon:'💼' },
        { id:'freelance', name:'Freelance', icon:'💻' },

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return buildDefaultState();
    const parsed = JSON.parse(raw);
    // mescla com os defaults para o caso de faltar alguma chave (ex: depois de uma atualização do app)
    return Object.assign(buildDefaultState(), parsed);
  }catch(e){
    console.error('Não foi possível ler os dados salvos, iniciando do zero.', e);
    return buildDefaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    console.error('Falha ao salvar dados:', e);
    showToast('Não foi possível salvar — verifique o espaço de armazenamento do navegador', '⚠️');
    return false;
  }
}


/* ---------------------------------------------------------
   3) CÁLCULOS DERIVADOS
   Tudo aqui é recalculado a partir das transações — nada de
   saldo "guardado solto" que possa dessincronizar.
   --------------------------------------------------------- */
function accountBalance(acc){
  const sum = state.transactions.reduce((s,t) => {
    if (t.accountId !== acc.id) return s;
    return s + (t.type === 'receita' ? t.amount : -t.amount);
  }, 0);
  return acc.initialBalance + sum;
}
function totalBalance(){ return state.accounts.reduce((s,a) => s + accountBalance(a), 0); }

function catById(type, id){
  return (state.categories[type] || []).find(c => c.id === id) || { name:'Outros', icon:'📦', color:'#64748b' };
}
function accById(id){ return state.accounts.find(a => a.id === id); }
function cardById(id){ return state.creditCards.find(c => c.id === id); }

function inRange(iso, start, end){ return iso >= start && iso <= end; }

function periodRange(filterKey, customStart, customEnd){
  const now = new Date();
  let start, end;
  switch(filterKey){
    case 'mes_anterior': { const d=addMonths(now,-1); start=firstDayOfMonth(d); end=lastDayOfMonth(d); break; }
    case '3m': start=firstDayOfMonth(addMonths(now,-2)); end=lastDayOfMonth(now); break;
    case '6m': start=firstDayOfMonth(addMonths(now,-5)); end=lastDayOfMonth(now); break;
    case 'ano': start=new Date(now.getFullYear(),0,1); end=new Date(now.getFullYear(),11,31); break;
    case 'custom': start=new Date(customStart+'T00:00:00'); end=new Date(customEnd+'T00:00:00'); break;
    default: start=firstDayOfMonth(now); end=lastDayOfMonth(now);
  }
  return { start:isoDate(start), end:isoDate(end) };
}

function sumByType(type, start, end){
  return state.transactions
    .filter(t => t.type===type && inRange(t.date,start,end))
    .reduce((s,t)=>s+t.amount,0);
}

function categorySpent(categoryId, start, end){
  return state.transactions
    .filter(t => t.type==='despesa' && t.categoryId===categoryId && inRange(t.date,start,end))
    .reduce((s,t)=>s+t.amount,0);
}

// fatura aberta = uma parcela de cada compra ativa no cartão
function cardOpenInvoice(cardId){
  return state.transactions
    .filter(t => t.isCardPurchase && t.cardId===cardId && !t.fullyPaid)
    .reduce((s,t)=>s+t.installmentValue,0);
}
// faturas futuras = parcelas restantes além da que está aberta agora
// (ex: parcela 1 de 3 está na fatura aberta; restam a 2ª e a 3ª = 2 parcelas futuras)
function cardFutureInvoices(cardId){
  return state.transactions
    .filter(t => t.isCardPurchase && t.cardId===cardId && !t.fullyPaid)
    .reduce((s,t)=> s + t.installmentValue * Math.max(0, t.installmentsTotal - t.installmentsCurrent), 0);
}
function cardUsedLimit(cardId){ return cardOpenInvoice(cardId) + cardFutureInvoices(cardId); }

function payCardInvoice(cardId, accountId){
  const card = cardById(cardId);
  const openAmt = cardOpenInvoice(cardId);
  if (openAmt <= 0){ showToast('Não há fatura em aberto para esse cartão', '⚠️'); return; }
  state.transactions.forEach(t => {
    if (t.isCardPurchase && t.cardId===cardId && !t.fullyPaid){
      t.installmentsCurrent++;
      if (t.installmentsCurrent >= t.installmentsTotal) t.fullyPaid = true;
    }
  });
  state.transactions.push({
    id:uid('t'), type:'despesa', description:`Pagamento fatura ${card.name}`, amount:openAmt,
    date: todayISO(), categoryId:'cartao', accountId, paymentMethod:'debito', recurring:false, note:'', isDemo:false
  });
  saveState();
  showToast(`Fatura de ${fmtMoney(openAmt)} paga!`, '✅');
}

// mantém contas a pagar em dia: se passou da data e ainda pendente, vira atrasada
function refreshBillStatuses(){
  let changed = false;
  state.bills.forEach(b => {
    if (b.status === 'pendente' && b.dueDate < todayISO()){ b.status = 'atrasada'; changed = true; }
  });
  if (changed) saveState();
}

function computeNotifications(){
  refreshBillStatuses();
  const alerts = [];
  const { start, end } = periodRange('este_mes');

  state.bills.forEach(b => {
    if (b.status === 'atrasada'){
      alerts.push({ level:'danger', text:`Conta atrasada: ${b.name} (${fmtMoney(b.amount)})`, sub:`venceu em ${fmtDateBR(b.dueDate)}` });
    } else if (b.status === 'pendente'){
      const diff = daysBetween(todayISO(), b.dueDate);
      if (diff <= 3) alerts.push({ level:'warning', text:`Conta vencendo: ${b.name} (${fmtMoney(b.amount)})`, sub: diff<=0 ? 'vence hoje' : `em ${diff} dia(s)` });
    }
  });

  state.budgets.forEach(bu => {
    const spent = categorySpent(bu.categoryId, start, end);
    const pct = spent / bu.limit;
    const cat = catById('despesa', bu.categoryId);
    if (pct >= 1) alerts.push({ level:'danger', text:`Orçamento de ${cat.name} ultrapassado`, sub:`${fmtMoney(spent)} de ${fmtMoney(bu.limit)}` });
    else if (pct >= 0.8) alerts.push({ level:'warning', text:`Orçamento de ${cat.name} perto do limite`, sub:`${Math.round(pct*100)}% utilizado` });
  });

  state.goals.forEach(g => {
    if (g.current >= g.target) alerts.push({ level:'success', text:`Meta atingida: ${g.title}`, sub:'parabéns!' });
  });

  state.creditCards.forEach(c => {
    const pct = cardUsedLimit(c.id) / c.limit;
    if (pct >= 0.8) alerts.push({ level:'warning', text:`Cartão ${c.name} em ${Math.round(pct*100)}% do limite`, sub:`disponível: ${fmtMoney(c.limit - cardUsedLimit(c.id))}` });
  });

  return alerts;
}

   --------------------------------------------------------- */
function donutChartSVG(items){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  let cum = 0;
  const r=40, cx=50, cy=50, circ=2*Math.PI*r;
  const segs = items.map(it => {
    const dash = (it.value/total)*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="16" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-cum}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    cum += dash;
    return seg;
  }).join('');
  return `<svg viewBox="0 0 100 100" style="width:100%; max-width:200px; display:block; margin:0 auto;">${segs}<circle cx="50" cy="50" r="29" fill="var(--surface)"></circle></svg>`;
}

function barPairChartSVG(labels, seriesA, seriesB, colorA, colorB){
  const max = Math.max(...seriesA, ...seriesB, 1);
  const w = 100/labels.length;
  let bars = '';
  labels.forEach((lab,i) => {
    const ha = Math.max(2,(seriesA[i]/max)*80), hb = Math.max(2,(seriesB[i]/max)*80);
    const gx = i*w;
    bars += `<rect x="${gx+w*0.15}%" y="${90-ha}%" width="${w*0.3}%" height="${ha}%" rx="2" fill="${colorA}"></rect>`;
    bars += `<rect x="${gx+w*0.5}%" y="${90-hb}%" width="${w*0.3}%" height="${hb}%" rx="2" fill="${colorB}"></rect>`;
    bars += `<text x="${gx+w/2}%" y="98%" font-size="7" text-anchor="middle" fill="var(--text-dim)">${lab}</text>`;
  });
  return `<svg viewBox="0 0 100 100" style="width:100%; height:190px;" preserveAspectRatio="none">${bars}</svg>`;
}

function lineChartSVG(values, labels){
  const max = Math.max(...values, 1);
  const stepX = 100/(values.length-1 || 1);
  const pts = values.map((v,i)=>`${i*stepX},${92-(v/max*78)}`).join(' ');
  const dots = values.map((v,i)=>`<circle cx="${i*stepX}" cy="${92-(v/max*78)}" r="1.8" fill="var(--primary)"></circle>`).join('');
  const labs = labels.map((l,i)=>`<text x="${i*stepX}" y="99" font-size="6.5" text-anchor="middle" fill="var(--text-dim)">${l}</text>`).join('');
  return `<svg viewBox="0 0 100 100" style="width:100%; height:190px;" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2"></polyline>${dots}${labs}
  </svg>`;
}

function buildTransactionFormHTML(type, idp, values){
  values = values || {};
  const isDespesa = type === 'despesa';
  const isCardEdit = !!values.isCardPurchase;
  return `
    <div class="field">
      <label>Descrição</label>
      <input id="${idp}-desc" placeholder="${isDespesa?'Ex: Supermercado':'Ex: Salário'}" value="${escapeAttr(values.description||'')}">
      <div class="err">Informe uma descrição.</div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Valor (R$)</label>
        <input id="${idp}-amount" type="number" step="0.01" min="0.01" placeholder="0,00" value="${values.amount||''}">
        <div class="err">Informe um valor válido.</div>
      </div>
      <div class="field">
        <label>Data</label>
        <input id="${idp}-date" type="date" value="${values.date||todayISO()}">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Categoria</label>
        <select id="${idp}-cat">${categoryOptions(type, values.categoryId)}</select>
      </div>
      ${!isCardEdit ? `<div class="field">
        <label>Conta</label>
        <select id="${idp}-acc">${accountOptions(values.accountId)}</select>
      </div>` : ''}
    </div>
    ${isDespesa && !isCardEdit ? `
    <div class="form-row">
      <div class="field">
        <label>Forma de pagamento</label>
        <select id="${idp}-pm">
          <option value="debito" ${values.paymentMethod==='debito'?'selected':''}>Débito</option>
          <option value="pix" ${values.paymentMethod==='pix'?'selected':''}>Pix</option>
          <option value="dinheiro" ${values.paymentMethod==='dinheiro'?'selected':''}>Dinheiro</option>
          ${values.id ? '' : `<option value="credito">Cartão de crédito</option>`}
        </select>
      </div>
      <div class="field" id="${idp}-installments-field" style="display:none;">
        <label>Parcelas</label>
        <input id="${idp}-installments" type="number" min="1" max="24" value="1">
      </div>
    </div>
    <div class="field" id="${idp}-card-field" style="display:none;">
      <label>Cartão</label>
      <select id="${idp}-card">${cardOptions()}</select>
    </div>` : ''}
    ${isCardEdit ? `<div class="field"><label>Cartão · parcelas</label><p style="font-size:.85rem; color:var(--text-dim);">${cardById(values.cardId)?.name||'Cartão'} — parcela ${values.installmentsCurrent}/${values.installmentsTotal} (não é possível alterar forma de pagamento ou parcelamento na edição)</p></div>` : ''}
    <div class="field">
      <label style="display:flex; align-items:center; gap:.5rem;"><input type="checkbox" id="${idp}-recurring" style="width:auto;" ${values.recurring?'checked':''}> Lançamento recorrente</label>
    </div>
    <div class="field">
      <label>Observação (opcional)</label>
      <textarea id="${idp}-note" placeholder="Observações...">${escapeHTML(values.note||'')}</textarea>
    </div>
    <button class="btn btn-primary btn-block" id="${idp}-submit">${values.id ? 'Salvar alterações' : (isDespesa?'Adicionar despesa':'Adicionar receita')}</button>
  `;
}

function bindTransactionForm(idp, type, onSuccess, editId){
  const accSel = document.getElementById(`${idp}-acc`);
  const pmSel = document.getElementById(`${idp}-pm`);
  const cardField = document.getElementById(`${idp}-card-field`);
  const instField = document.getElementById(`${idp}-installments-field`);

  function syncCreditFields(){
    if (!pmSel) return;
    const isCredito = pmSel.value === 'credito';
    cardField.style.display = isCredito ? 'block' : 'none';
    instField.style.display = isCredito ? 'block' : 'none';
    accSel.closest('.field').style.opacity = isCredito ? '.5' : '1';
    accSel.disabled = isCredito;
  }
  if (pmSel){ pmSel.addEventListener('change', syncCreditFields); syncCreditFields(); }

  document.getElementById(`${idp}-submit`).addEventListener('click', () => {
    const descEl = document.getElementById(`${idp}-desc`);
    const amountEl = document.getElementById(`${idp}-amount`);
    const desc = descEl.value.trim();
    const amount = parseFloat(amountEl.value);

    let valid = true;
    descEl.closest('.field').classList.toggle('invalid', !desc);
    amountEl.closest('.field').classList.toggle('invalid', !(amount > 0));
    if (!desc || !(amount > 0)) valid = false;
    if (!valid) return;

    const date = document.getElementById(`${idp}-date`).value || todayISO();
    const categoryId = document.getElementById(`${idp}-cat`).value;
    const recurring = document.getElementById(`${idp}-recurring`).checked;
    const note = document.getElementById(`${idp}-note`).value.trim();

    if (editId){
      const t = state.transactions.find(x => x.id === editId);
      Object.assign(t, { description:desc, amount, date, categoryId, recurring, note });
      if (!t.isCardPurchase){
        const accSelEl = document.getElementById(`${idp}-acc`);
        if (accSelEl) t.accountId = accSelEl.value;
        const pmSelEl = document.getElementById(`${idp}-pm`);
        if (pmSelEl && pmSelEl.value !== 'credito') t.paymentMethod = pmSelEl.value;
      }
      saveState();
      showToast('Lançamento atualizado!', '✏️');
      onSuccess();
      return;
    }

    if (type === 'despesa'){
      const pm = document.getElementById(`${idp}-pm`).value;
      if (pm === 'credito'){
        const cardId = document.getElementById(`${idp}-card`).value;
        const totalInst = Math.max(1, parseInt(document.getElementById(`${idp}-installments`).value) || 1);
        state.transactions.push({
          id:uid('t'), type:'despesa', description:desc, amount, date, categoryId, accountId:null,
          paymentMethod:'credito', recurring, note, isDemo:false,
          isCardPurchase:true, cardId, installmentsCurrent:1, installmentsTotal:totalInst, installmentValue: amount/totalInst, fullyPaid:false
        });
      } else {
        const accountId = document.getElementById(`${idp}-acc`).value;
        state.transactions.push({ id:uid('t'), type:'despesa', description:desc, amount, date, categoryId, accountId, paymentMethod:pm, recurring, note, isDemo:false });
      }
      showToast('Despesa adicionada!', '➖');
    } else {
      const accountId = document.getElementById(`${idp}-acc`).value;
      state.transactions.push({ id:uid('t'), type:'receita', description:desc, amount, date, categoryId, accountId, recurring, note, isDemo:false });
      showToast('Receita adicionada!', '➕');
    }
    saveState();
    onSuccess();
  });
}

function deleteTransaction(id){
  if (!confirm('Tem certeza que deseja excluir este lançamento? Essa ação não pode ser desfeita.')) return;
  state.transactions = state.transactions.filter(t => t.id !== id);
  saveState();
  showToast('Lançamento excluído', '🗑️');
  const activePage = document.querySelector('.page.active').id.replace('page-','');
  RENDERERS[activePage]();
}

/* ---------------------------------------------------------
   SELETOR DE CONTA (substitui prompt() por uma lista clicável)
   --------------------------------------------------------- */
function openAccountPicker(title, onPick){
  if (state.accounts.length === 0){
    showToast('Crie uma conta antes de continuar', '⚠️');
    showPage('contas');
    return;
  }
  if (state.accounts.length === 1){ onPick(state.accounts[0].id); return; }

  document.getElementById('account-picker-title').textContent = title;
  const list = document.getElementById('account-picker-list');
  list.innerHTML = state.accounts.map(a => `<button class="btn btn-ghost btn-block" style="margin-bottom:.5rem; justify-content:space-between;" data-pick="${a.id}"><span>${escapeHTML(a.name)}</span><span class="mono">${fmtMoney(accountBalance(a))}</span></button>`).join('');
  list.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    closeAccountPicker();
    onPick(b.dataset.pick);
  }));
  document.getElementById('account-picker-overlay').classList.add('open');
}
function closeAccountPicker(){ document.getElementById('account-picker-overlay').classList.remove('open'); }
document.getElementById('account-picker-close').addEventListener('click', closeAccountPicker);
document.getElementById('account-picker-overlay').addEventListener('click', (e) => { if (e.target.id==='account-picker-overlay') closeAccountPicker(); });

/* ---------------------------------------------------------
   linha de transação reutilizável (lista)
   --------------------------------------------------------- */
function renderRowHTML(t){
  const cat = catById(t.type==='receita'?'receita':'despesa', t.categoryId);
  const acc = t.accountId ? accById(t.accountId) : null;
  const sourceLabel = t.isCardPurchase ? `${cardById(t.cardId)?.name||'Cartão'} · ${t.installmentsCurrent}/${t.installmentsTotal}x` : (acc ? acc.name : '—');
  return `
    <div class="row-item">
      <div class="row-icon" style="background:color-mix(in srgb, ${cat.color||'#22c55e'} 20%, transparent); color:${cat.color||'#22c55e'};">${cat.icon}</div>
      <div class="row-main">
        <div class="row-title">${escapeHTML(t.description)}</div>
        <div class="row-meta">${fmtDateBR(t.date)} · ${escapeHTML(cat.name)} · ${escapeHTML(sourceLabel)}${t.recurring?' · recorrente':''}</div>
      </div>
      <div class="row-amount ${t.type==='receita'?'income':'expense'}">${t.type==='receita'?'+':'-'} ${fmtMoney(t.amount)}</div>
      <div class="row-actions">
        <button data-edit="${t.id}" title="Editar">✎</button>
        <button data-del="${t.id}" title="Excluir">🗑</button>
      </div>
    </div>`;
}
function bindRowActions(container, type){
  container.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteTransaction(b.dataset.del)));
  container.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditTransaction(b.dataset.edit, type)));
}
function openEditTransaction(id, type){
  const t = state.transactions.find(x => x.id === id);
  quickType = t.type;
  document.getElementById('quick-modal-overlay').classList.add('open');
  document.querySelectorAll('.type-toggle button').forEach(b => b.classList.toggle('active', b.dataset.type===quickType));
  document.getElementById('quick-form-body').innerHTML = buildTransactionFormHTML(t.type, 'q', t);
  bindTransactionForm('q', t.type, () => { closeQuickModal(); refreshCurrentPage(); }, id);
}

let dashPeriod = 'este_mes';
function renderDashboard(){
  const el = document.getElementById('page-dashboard');

  if (state.accounts.length === 0){
    el.innerHTML = `
      <div class="card" style="text-align:center; padding:3rem 1.5rem;">
        <div style="font-size:2.4rem; margin-bottom:.6rem;">👋</div>
        <h2 style="margin-bottom:.5rem;">Bem-vindo ao FinanCerto</h2>
        <p style="color:var(--text-dim); max-width:420px; margin:0 auto 1.4rem;">Você ainda não tem nenhuma conta cadastrada. Crie sua primeira conta para começar a registrar receitas e despesas — seu saldo começa em R$ 0,00 até você lançar algo de verdade.</p>
        <button class="btn btn-primary" id="empty-goto-contas">Criar minha primeira conta</button>
      </div>`;
    document.getElementById('empty-goto-contas').addEventListener('click', () => { showAccountForm = true; showPage('contas'); });
    return;
  }
  const { start, end } = periodRange(dashPeriod);
  const receitasMes = sumByType('receita', start, end);
  const despesasMes = sumByType('despesa', start, end);
  const disponivel = receitasMes - despesasMes;
  const comprometida = receitasMes>0 ? Math.min(100, Math.round((despesasMes/receitasMes)*100)) : 0;
  const economizado = Math.max(0, disponivel);
  const saude = comprometida < 60 ? {label:'Saudável', cls:'badge-success'} : comprometida < 90 ? {label:'Atenção', cls:'badge-warning'} : {label:'Crítico', cls:'badge-danger'};

  const proximasContas = state.bills.filter(b=>b.status!=='paga').sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,4);
  const despesasRecentes = state.transactions.filter(t=>t.type==='despesa').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const receitasRecentes = state.transactions.filter(t=>t.type==='receita').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  el.innerHTML = `
    <div class="section-head">
      <h2>Visão geral</h2>
      <select id="dash-period" style="max-width:200px;">
        <option value="este_mes" ${dashPeriod==='este_mes'?'selected':''}>Este mês</option>
        <option value="mes_anterior" ${dashPeriod==='mes_anterior'?'selected':''}>Mês anterior</option>
        <option value="3m" ${dashPeriod==='3m'?'selected':''}>Últimos 3 meses</option>
        <option value="6m" ${dashPeriod==='6m'?'selected':''}>Últimos 6 meses</option>
        <option value="ano" ${dashPeriod==='ano'?'selected':''}>Este ano</option>
      </select>
    </div>

    <div class="grid grid-4">
      <div class="card stat-card"><div class="top">Saldo atual<span>💰</span></div><div class="val">${fmtMoney(totalBalance())}</div></div>
      <div class="card stat-card"><div class="top">Receitas do período<span>⬆</span></div><div class="val pos">${fmtMoney(receitasMes)}</div></div>
      <div class="card stat-card"><div class="top">Despesas do período<span>⬇</span></div><div class="val neg">${fmtMoney(despesasMes)}</div></div>
      <div class="card stat-card"><div class="top">Disponível<span>◈</span></div><div class="val ${disponivel>=0?'pos':'neg'}">${fmtMoney(disponivel)}</div></div>
    </div>

    <div class="grid grid-4" style="margin-top:1rem;">
      <div class="card stat-card"><div class="top">Renda comprometida</div><div class="val">${comprometida}%</div><div class="progress-bar" style="margin-top:.3rem;"><div class="progress-fill" style="width:${comprometida}%; background:${comprometida<60?'var(--success)':comprometida<90?'var(--warning)':'var(--danger)'};"></div></div></div>
      <div class="card stat-card"><div class="top">Economizado no período</div><div class="val pos">${fmtMoney(economizado)}</div></div>
      <div class="card stat-card"><div class="top">Saúde financeira</div><div style="margin-top:.3rem;"><span class="badge ${saude.cls}">${saude.label}</span></div></div>
      <div class="card stat-card"><div class="top">Contas em aberto</div><div class="val">${state.bills.filter(b=>b.status!=='paga').length}</div></div>
      <div class="card stat-card"><div class="top">Transações no período</div><div class="val">${state.transactions.filter(t=>inRange(t.date,start,end)).length}</div></div>
    </div>

    <div class="grid grid-2" style="margin-top:1rem;">
      <div class="card">
        <h3>Receitas x Despesas (últimos 6 meses)</h3>
        <div id="dash-bar"></div>
        <div class="chart-legend"><span><i style="background:var(--success)"></i>Receitas</span><span><i style="background:var(--danger)"></i>Despesas</span></div>
      </div>
      <div class="card">
        <h3>Despesas por categoria</h3>
        <div id="dash-donut"></div>
        <div class="chart-legend" id="dash-donut-legend"></div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:1rem;">
      <div class="card">
        <div class="section-head"><h3 style="margin:0;">Contas próximas do vencimento</h3><button class="btn btn-ghost btn-sm" data-nav="contasPagar">Ver todas</button></div>
        <div id="dash-bills"></div>
      </div>
      <div class="card">
        <h3>Evolução do saldo</h3>
        <div id="dash-line"></div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:1rem;">
      <div class="card">
        <div class="section-head"><h3 style="margin:0;">Despesas recentes</h3><button class="btn btn-ghost btn-sm" data-nav="despesas">Ver todas</button></div>
        <div>${despesasRecentes.length ? despesasRecentes.map(renderRowHTML).join('') : '<div class="empty-hint">Nenhuma despesa registrada.</div>'}</div>
      </div>
      <div class="card">
        <div class="section-head"><h3 style="margin:0;">Receitas recentes</h3><button class="btn btn-ghost btn-sm" data-nav="receitas">Ver todas</button></div>
        <div>${receitasRecentes.length ? receitasRecentes.map(renderRowHTML).join('') : '<div class="empty-hint">Nenhuma receita registrada.</div>'}</div>
      </div>
    </div>

    <div class="card" style="margin-top:1rem;">
      <div class="section-head"><h3 style="margin:0;">Metas em andamento</h3><button class="btn btn-ghost btn-sm" data-nav="metas">Ver todas</button></div>
      <div id="dash-goals"></div>
    </div>
  `;

  document.getElementById('dash-period').addEventListener('change', (e) => { dashPeriod = e.target.value; renderDashboard(); });
  el.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => showPage(b.dataset.nav)));

  // gráfico de barras: últimos 6 meses
  const months = [...Array(6)].map((_,i) => addMonths(new Date(), -5+i));
  const receitasSeries = months.map(m => sumByType('receita', isoDate(firstDayOfMonth(m)), isoDate(lastDayOfMonth(m))));
  const despesasSeries = months.map(m => sumByType('despesa', isoDate(firstDayOfMonth(m)), isoDate(lastDayOfMonth(m))));
  document.getElementById('dash-bar').innerHTML = barPairChartSVG(months.map(fmtMonthLabel), receitasSeries, despesasSeries, 'var(--success)', 'var(--danger)');

  // donut de despesas por categoria (no período selecionado)
  const catSpend = state.categories.despesa.map(c => ({ label:c.name, value:categorySpent(c.id,start,end), color:c.color })).filter(x=>x.value>0);
  document.getElementById('dash-donut').innerHTML = catSpend.length ? donutChartSVG(catSpend) : '<div class="empty-hint">Sem despesas no período.</div>';
  document.getElementById('dash-donut-legend').innerHTML = catSpend.map(c => `<span><i style="background:${c.color}"></i>${c.label} — ${fmtMoney(c.value)}</span>`).join('');

  // evolução do saldo: saldo acumulado até o fim de cada um dos últimos 6 meses
  const saldoSeries = months.map(m => {
    const cutoff = isoDate(lastDayOfMonth(m));
    return state.accounts.reduce((s,a) => {
      const sumUntil = state.transactions.filter(t=>t.accountId===a.id && t.date<=cutoff).reduce((s2,t)=>s2+(t.type==='receita'?t.amount:-t.amount),0);
      return s + a.initialBalance + sumUntil;
    },0);
  });
  document.getElementById('dash-line').innerHTML = lineChartSVG(saldoSeries, months.map(fmtMonthLabel));

  document.getElementById('dash-bills').innerHTML = proximasContas.length ? proximasContas.map(b => `
    <div class="row-item">
      <div class="row-icon" style="background:color-mix(in srgb, ${b.status==='atrasada'?'var(--danger)':'var(--warning)'} 20%, transparent); color:${b.status==='atrasada'?'var(--danger)':'var(--warning)'};">🧾</div>
      <div class="row-main"><div class="row-title">${b.name}</div><div class="row-meta">Vence ${fmtDateBR(b.dueDate)}</div></div>
      <span class="badge ${b.status==='atrasada'?'badge-danger':'badge-warning'}">${b.status==='atrasada'?'Atrasada':'Pendente'}</span>
    </div>`).join('') : '<div class="empty-hint">Nenhuma conta pendente.</div>';

  document.getElementById('dash-goals').innerHTML = state.goals.length ? state.goals.map(goalRowHTML).join('') : '<div class="empty-hint">Nenhuma meta criada ainda.</div>';
}

/* ---------------------------------------------------------
   TRANSAÇÕES (central, com filtros/busca/ordenação/paginação)
   --------------------------------------------------------- */
let txFilters = { type:'todas', categoryId:'todas', accountId:'todas', period:'todos', search:'', sort:'data_desc', page:1 };
const TX_PAGE_SIZE = 8;

function renderTransacoes(){
  const el = document.getElementById('page-transacoes');
  el.innerHTML = `
    <div class="section-head"><h2>Transações</h2><button class="btn btn-primary btn-sm" id="tx-add-btn">+ Novo lançamento</button></div>
    <div class="card" style="margin-bottom:1rem;">
      <div class="filters-bar">
        <input id="tx-search" placeholder="Buscar por descrição..." value="${txFilters.search}">
        <select id="tx-type"><option value="todas">Todos os tipos</option><option value="receita">Receitas</option><option value="despesa">Despesas</option></select>
        <select id="tx-cat"><option value="todas">Todas categorias</option></select>
        <select id="tx-acc"><option value="todas">Todas contas</option>${accountOptions()}</select>
        <select id="tx-sort">
          <option value="data_desc">Data (mais recente)</option>
          <option value="data_asc">Data (mais antiga)</option>
          <option value="valor_desc">Valor (maior)</option>
          <option value="valor_asc">Valor (menor)</option>
        </select>
      </div>
    </div>
    <div class="card"><div id="tx-list"></div><div id="tx-pagination" style="display:flex; justify-content:center; gap:.6rem; margin-top:1rem;"></div></div>
  `;

  const catSel = document.getElementById('tx-cat');
  const allCats = [...state.categories.receita, ...state.categories.despesa];
  allCats.forEach(c => catSel.insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.icon} ${c.name}</option>`));

  document.getElementById('tx-type').value = txFilters.type;
  catSel.value = txFilters.categoryId;
  document.getElementById('tx-acc').value = txFilters.accountId;
  document.getElementById('tx-sort').value = txFilters.sort;

  document.getElementById('tx-add-btn').addEventListener('click', openQuickModal);
  document.getElementById('tx-search').addEventListener('input', (e) => { txFilters.search = e.target.value; txFilters.page=1; renderTxList(); });
  document.getElementById('tx-type').addEventListener('change', (e) => { txFilters.type = e.target.value; txFilters.page=1; renderTxList(); });
  catSel.addEventListener('change', (e) => { txFilters.categoryId = e.target.value; txFilters.page=1; renderTxList(); });
  document.getElementById('tx-acc').addEventListener('change', (e) => { txFilters.accountId = e.target.value; txFilters.page=1; renderTxList(); });
  document.getElementById('tx-sort').addEventListener('change', (e) => { txFilters.sort = e.target.value; renderTxList(); });

  renderTxList();
}

function renderTxList(){
  let list = [...state.transactions];
  if (txFilters.type !== 'todas') list = list.filter(t => t.type === txFilters.type);
  if (txFilters.categoryId !== 'todas') list = list.filter(t => t.categoryId === txFilters.categoryId);
  if (txFilters.accountId !== 'todas') list = list.filter(t => t.accountId === txFilters.accountId);
  if (txFilters.search.trim()) list = list.filter(t => t.description.toLowerCase().includes(txFilters.search.trim().toLowerCase()));

  const sorters = {
    data_desc:(a,b)=>b.date.localeCompare(a.date), data_asc:(a,b)=>a.date.localeCompare(b.date),
    valor_desc:(a,b)=>b.amount-a.amount, valor_asc:(a,b)=>a.amount-b.amount
  };
  list.sort(sorters[txFilters.sort]);

  const totalPages = Math.max(1, Math.ceil(list.length / TX_PAGE_SIZE));
  txFilters.page = Math.min(txFilters.page, totalPages);
  const pageItems = list.slice((txFilters.page-1)*TX_PAGE_SIZE, txFilters.page*TX_PAGE_SIZE);

  const box = document.getElementById('tx-list');
  box.innerHTML = pageItems.length ? pageItems.map(renderRowHTML).join('') : '<div class="empty-hint">Nenhuma transação encontrada com esses filtros.</div>';
  bindRowActions(box);

  const pag = document.getElementById('tx-pagination');
  pag.innerHTML = totalPages>1 ? `
    <button class="btn btn-ghost btn-sm" id="tx-prev" ${txFilters.page===1?'disabled':''}>← Anterior</button>
    <span style="align-self:center; font-size:.82rem; color:var(--text-dim);">Página ${txFilters.page} de ${totalPages}</span>
    <button class="btn btn-ghost btn-sm" id="tx-next" ${txFilters.page===totalPages?'disabled':''}>Próxima →</button>` : '';
  if (totalPages>1){
    document.getElementById('tx-prev').addEventListener('click', () => { txFilters.page--; renderTxList(); });
    document.getElementById('tx-next').addEventListener('click', () => { txFilters.page++; renderTxList(); });
  }
}

let showAccountForm = false;
const ACCOUNT_TYPE_LABEL = { corrente:'Conta corrente', poupanca:'Poupança', carteira_digital:'Carteira digital', dinheiro:'Dinheiro' };

function renderContas(){
  const el = document.getElementById('page-contas');
  el.innerHTML = `

    <div class="card" id="acc-form-card" style="display:${showAccountForm?'block':'none'}; margin-bottom:1rem;">
      <div class="form-row">
        <div class="field"><label>Nome</label><input id="acc-name" placeholder="Ex: Conta do banco X"></div>
        <div class="field"><label>Tipo</label>
          <select id="acc-type">
            <option value="corrente">Conta corrente</option>
            <option value="poupanca">Poupança</option>
            <option value="carteira_digital">Carteira digital</option>
            <option value="dinheiro">Dinheiro</option>
          </select>
        </div>
        <div class="field"><label>Saldo inicial (R$)</label><input id="acc-balance" type="number" step="0.01" value="0"></div>
      </div>
      <button class="btn btn-primary" id="acc-save">Salvar conta</button>
    </div>
    <div class="grid grid-3" id="acc-grid"></div>
  `;
  document.getElementById('toggle-acc-form').addEventListener('click', () => { showAccountForm=!showAccountForm; renderContas(); });
  if (showAccountForm){
    document.getElementById('acc-save').addEventListener('click', () => {
      const name = document.getElementById('acc-name').value.trim();
      if (!name){ showToast('Digite um nome para a conta','⚠️'); return; }
      state.accounts.push({ id:uid('acc'), name, type:document.getElementById('acc-type').value, initialBalance: parseFloat(document.getElementById('acc-balance').value)||0, isDemo:false });
      saveState(); showToast('Conta criada!','➕'); showAccountForm=false; renderContas();
    });
  }

  document.getElementById('acc-grid').innerHTML = state.accounts.map(a => {
    const bal = accountBalance(a);
    const recent = state.transactions.filter(t=>t.accountId===a.id).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,3);
    return `<div class="card">
      <div class="section-head" style="margin-bottom:.5rem;">
        <div><h3 style="margin-bottom:.15rem;">${escapeHTML(a.name)}</h3><span style="font-size:.76rem; color:var(--text-dim);">${ACCOUNT_TYPE_LABEL[a.type]||a.type}</span></div>

      </div>
      <div class="val mono" style="font-size:1.4rem; font-weight:800; margin-bottom:.8rem; color:${bal>=0?'var(--success)':'var(--danger)'};">${fmtMoney(bal)}</div>

      ${recent.length ? recent.map(t=>`<div class="row-item" style="padding:.4rem 0;"><div class="row-main"><div class="row-title" style="font-size:.82rem;">${t.description}</div><div class="row-meta">${fmtDateBR(t.date)}</div></div><div class="row-amount ${t.type==='receita'?'income':'expense'}" style="font-size:.8rem;">${t.type==='receita'?'+':'-'}${fmtMoney(t.amount)}</div></div>`).join('') : '<div class="empty-hint" style="padding:.5rem 0;">Sem movimentações.</div>'}
    </div>`;
  }).join('');

  document.querySelectorAll('[data-delacc]').forEach(b => b.addEventListener('click', () => {
    if (state.transactions.some(t=>t.accountId===b.dataset.delacc)){ showToast('Essa conta tem transações vinculadas e não pode ser excluída','⚠️'); return; }
    if (!confirm('Excluir esta conta?')) return;
    state.accounts = state.accounts.filter(a=>a.id!==b.dataset.delacc);
    saveState(); renderContas();
  }));
}

  document.getElementById('card-grid').innerHTML = state.creditCards.map(c => {
    const open = cardOpenInvoice(c.id), future = cardFutureInvoices(c.id), used = open+future, avail = Math.max(0,c.limit-used);
    const pct = Math.min(100, Math.round((used/c.limit)*100));
    const purchases = state.transactions.filter(t=>t.isCardPurchase && t.cardId===c.id && !t.fullyPaid);
    return `<div class="card">
      <div class="cc-card" style="background:linear-gradient(135deg, ${c.color}, color-mix(in srgb, ${c.color} 60%, #000));">
        <div><div class="cc-name">${escapeHTML(c.name)}</div><div class="cc-sub">fecha dia ${c.closingDay} · vence dia ${c.dueDay}</div></div>
        <div><div class="cc-limit">${fmtMoney(open)}</div><div class="cc-sub">fatura atual em aberto</div>
        <div class="cc-bar"><div class="cc-bar-fill" style="width:${pct}%;"></div></div>
        <div class="cc-sub" style="margin-top:.3rem;">${pct}% do limite comprometido</div></div>
      </div>
      <div style="margin-top:.8rem; font-size:.82rem; display:flex; justify-content:space-between;"><span>Faturas futuras</span><b>${fmtMoney(future)}</b></div>
      <div style="font-size:.82rem; display:flex; justify-content:space-between; margin-bottom:.7rem;"><span>Limite disponível</span><b>${fmtMoney(avail)}</b></div>
      <div style="font-size:.76rem; color:var(--text-dim); margin-bottom:.4rem;">Compras na fatura atual</div>
      ${purchases.length ? purchases.map(p=>`<div class="row-item" style="padding:.35rem 0;"><div class="row-main"><div class="row-title" style="font-size:.8rem;">${p.description}</div><div class="row-meta">${p.installmentsCurrent}/${p.installmentsTotal}x</div></div><div class="row-amount expense" style="font-size:.78rem;">${fmtMoney(p.installmentValue)}</div></div>`).join('') : '<div class="empty-hint" style="padding:.4rem 0;">Nenhuma compra em aberto.</div>'}
      <div style="display:flex; gap:.5rem; margin-top:.8rem;">
        <button class="btn btn-primary btn-sm" data-pay="${c.id}" ${open<=0?'disabled':''}>Pagar fatura</button>
        <button class="btn btn-danger btn-sm" data-delcard="${c.id}">Excluir</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty-hint">Nenhum cartão cadastrado.</div>';

  document.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', () => {
    openAccountPicker('Pagar fatura com qual conta?', (accId) => { payCardInvoice(b.dataset.pay, accId); renderCartoes(); });
  }));
  document.querySelectorAll('[data-delcard]').forEach(b => b.addEventListener('click', () => {
    if (state.transactions.some(t=>t.cardId===b.dataset.delcard && !t.fullyPaid)){ showToast('Esse cartão tem fatura em aberto e não pode ser excluído','⚠️'); return; }
    if (!confirm('Excluir este cartão?')) return;
    state.creditCards = state.creditCards.filter(c=>c.id!==b.dataset.delcard);
    saveState(); renderCartoes();
  }));
}

function goalRowHTML(g){
  const pct = Math.min(100, Math.round((g.current/g.target)*100));
  const done = g.current >= g.target;
  return `<div class="goal-item" style="margin-bottom:1rem;">
    <div style="display:flex; justify-content:space-between; font-size:.88rem; margin-bottom:.4rem;">
      <span>${escapeHTML(g.title)} ${done?'<span class="badge badge-success">Concluída</span>':''}</span>
      <b>${fmtMoney(g.current)} / ${fmtMoney(g.target)}</b>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%; background:${done?'var(--success)':'var(--primary)'};"></div></div>
    <div style="display:flex; justify-content:space-between; font-size:.74rem; color:var(--text-dim); margin-top:.3rem;">
      <span>${pct}% concluído · faltam ${fmtMoney(Math.max(0,g.target-g.current))}</span>
      <span>prazo: ${fmtDateBR(g.deadline)}</span>
    </div>
  </div>`;
}

  }

  document.getElementById('budget-grid').innerHTML = state.budgets.length ? state.budgets.map(bu => {

    const over = spent > bu.limit;
    return `<div class="card">
      <div style="display:flex; align-items:center; gap:.5rem; margin-bottom:.6rem;">
        <span style="font-size:1.2rem;">${cat.icon}</span><h3 style="margin:0;">${cat.name}</h3>

      <div style="display:flex; justify-content:space-between; font-size:.8rem; margin-top:.5rem;"><span>Gasto: ${fmtMoney(spent)}</span><span>Limite: ${fmtMoney(bu.limit)}</span></div>

    </div>`;
  }).join('') : '<div class="empty-hint">Nenhum orçamento definido ainda.</div>';

  document.querySelectorAll('[data-del-budget]').forEach(b => b.addEventListener('click', () => {
    state.budgets = state.budgets.filter(x=>x.categoryId!==b.dataset.delBudget);
    saveState(); renderOrcamento();
  }));
}

/* ---------------------------------------------------------
   RELATÓRIOS
   --------------------------------------------------------- */
let relatPeriod = '6m';
function renderRelatorios(){
  const el = document.getElementById('page-relatorios');
  const { start, end } = periodRange(relatPeriod);
  const receitas = sumByType('receita', start, end), despesas = sumByType('despesa', start, end);

  const catSpend = state.categories.despesa
    .map(c => ({ label:c.name, value:categorySpent(c.id,start,end), color:c.color }))
    .filter(x=>x.value>0).sort((a,b)=>b.value-a.value);

  const maioresDespesas = state.transactions.filter(t=>t.type==='despesa' && inRange(t.date,start,end)).sort((a,b)=>b.amount-a.amount).slice(0,6);

  const months = relatPeriod==='ano' ? [...Array(12)].map((_,i)=>new Date(new Date().getFullYear(),i,1)) : [...Array(6)].map((_,i) => addMonths(new Date(), -5+i));
  const rSeries = months.map(m => sumByType('receita', isoDate(firstDayOfMonth(m)), isoDate(lastDayOfMonth(m))));
  const dSeries = months.map(m => sumByType('despesa', isoDate(firstDayOfMonth(m)), isoDate(lastDayOfMonth(m))));

  const prevRange = periodRange(relatPeriod==='mes_anterior' ? 'este_mes' : 'mes_anterior');
  const despesasAnterior = sumByType('despesa', prevRange.start, prevRange.end);
  const variacao = despesasAnterior>0 ? Math.round(((despesas-despesasAnterior)/despesasAnterior)*100) : 0;

  el.innerHTML = `
    <div class="section-head">
      <h2>Relatórios</h2>
      <select id="relat-period" style="max-width:200px;">
        <option value="este_mes" ${relatPeriod==='este_mes'?'selected':''}>Este mês</option>
        <option value="3m" ${relatPeriod==='3m'?'selected':''}>Últimos 3 meses</option>
        <option value="6m" ${relatPeriod==='6m'?'selected':''}>Últimos 6 meses</option>
        <option value="ano" ${relatPeriod==='ano'?'selected':''}>Este ano</option>
      </select>
    </div>

    <div class="grid grid-4">
      <div class="card stat-card"><div class="top">Receitas no período</div><div class="val pos">${fmtMoney(receitas)}</div></div>
      <div class="card stat-card"><div class="top">Despesas no período</div><div class="val neg">${fmtMoney(despesas)}</div></div>
      <div class="card stat-card"><div class="top">Saldo do período</div><div class="val ${receitas-despesas>=0?'pos':'neg'}">${fmtMoney(receitas-despesas)}</div></div>
      <div class="card stat-card"><div class="top">Vs. mês anterior</div><div class="val ${variacao<=0?'pos':'neg'}">${variacao>0?'+':''}${variacao}%</div></div>
    </div>

    <div class="grid grid-2" style="margin-top:1rem;">
      <div class="card"><h3>Receitas x despesas</h3><div id="rel-bar"></div></div>
      <div class="card"><h3>Gastos por categoria</h3><div id="rel-donut"></div><div class="chart-legend" id="rel-legend"></div></div>
    </div>

    <div class="grid grid-2" style="margin-top:1rem;">
      <div class="card">
        <h3>Maiores despesas do período</h3>
        <div>${maioresDespesas.length ? maioresDespesas.map(renderRowHTML).join('') : '<div class="empty-hint">Sem despesas no período.</div>'}</div>
      </div>
      <div class="card">
        <h3>Categorias que mais consomem</h3>
        <div>${catSpend.length ? catSpend.map((c,i) => `
          <div class="row-item"><div class="row-icon" style="background:color-mix(in srgb, ${c.color} 20%, transparent); color:${c.color};">${i+1}</div>
          <div class="row-main"><div class="row-title">${c.label}</div></div><div class="row-amount expense">${fmtMoney(c.value)}</div></div>`).join('') : '<div class="empty-hint">Sem dados no período.</div>'}
      </div>
    </div>
  `;
  document.getElementById('relat-period').addEventListener('change', (e) => { relatPeriod=e.target.value; renderRelatorios(); });
  document.getElementById('rel-bar').innerHTML = barPairChartSVG(months.map(fmtMonthLabel), rSeries, dSeries, 'var(--success)', 'var(--danger)');
  document.getElementById('rel-donut').innerHTML = catSpend.length ? donutChartSVG(catSpend) : '<div class="empty-hint">Sem despesas no período.</div>';
  document.getElementById('rel-legend').innerHTML = catSpend.map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join('');
}
